name = "forever-armory"
main = "worker.js"
compatibility_date = "2026-11-01"

# The site's origin. Requests from anywhere else get no CORS header.
# Comma-separate to allow more than one, e.g. for local testing:
#   ALLOWED_ORIGINS = "https://kalium2.github.io,http://localhost:8000"
[vars]
ALLOWED_ORIGINS = "https://kalium2.github.io"

# Secrets (never commit these). Set them once with:
#   npx wrangler secret put BLIZZARD_CLIENT_ID
#   npx wrangler secret put BLIZZARD_CLIENT_SECRET
